<!doctype html>
<html lang="en" class="scroll-smooth" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbe4e4" />
    <title>Sreeved V P — Engineering Craft</title>
    <meta name="description" content="Portfolio of Sreeved V P, Software Engineer. Precision systems, scalable architectures." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script>
    {
      let stored;
      try { stored = localStorage.getItem('portfolio-editorial-theme'); } catch {}
      if (stored === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.querySelector('meta[name="theme-color"]').content = '#241d1e';
      }
    }
    </script>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
